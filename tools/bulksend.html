<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BulkSend Pro — PropAI Suite</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root { --bg: #0D1117; --bg2: #161B22; --bg3: #1C2330; --bg4: #242D3A; --green: #25D366; --green-dim: rgba(37,211,102,0.12); --gold: #C8A96E; --text: #E6EDF3; --muted: #7D8590; --border: rgba(37,211,102,0.15); --red: #F85149; --yellow: #E3B341; --blue: #58A6FF; --radius: 10px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Epilogue', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(37,211,102,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .app { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
    .header { grid-column: 1 / -1; padding: 14px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(22,27,34,0.9); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; }
    .logo { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; } .logo-icon { width: 34px; height: 34px; background: var(--green); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #000; font-weight: 800; } .logo span { color: var(--green); }
    .license-badge { font-size: 0.7rem; color: var(--muted); background: var(--bg3); padding: 5px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.08); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-stats { display: flex; gap: 24px; font-size: 0.8rem; color: var(--muted); text-align: center; } .stat-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); display: block; }
    .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 63px; height: calc(100vh - 63px); }
    .section-title { font-family: 'Syne', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; } label { font-size: 0.72rem; font-weight: 500; color: var(--muted); letter-spacing: 0.3px; }
    input, select, textarea { background: var(--bg3); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); color: var(--text); font-family: 'Epilogue', sans-serif; font-size: 0.85rem; padding: 10px 12px; transition: border-color 0.2s, box-shadow 0.2s; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    .paste-area { background: var(--bg3); border: 1px dashed rgba(37,211,102,0.3); border-radius: var(--radius); padding: 12px; font-family: 'Courier New', monospace; font-size: 0.73rem; color: var(--text); resize: vertical; min-height: 130px; width: 100%; line-height: 1.6; } .paste-area:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    .paste-hint { font-size: 0.68rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { padding: 5px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--muted); font-size: 0.72rem; font-family: 'Epilogue', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; } .chip.active { border-color: var(--green); color: var(--green); background: var(--green-dim); } .chip:hover:not(.active) { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .chip.locked { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
    .upgrade-link { font-size: 0.6rem; color: var(--gold); margin-left: 4px; }
    .btn-generate { width: 100%; padding: 14px; background: var(--green); color: #000; border: none; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; } .btn-generate:hover { filter: brightness(1.1); transform: translateY(-1px); } .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }
    .progress-wrap { display: none; flex-direction: column; gap: 6px; } .progress-wrap.visible { display: flex; } .progress-bar-track { height: 4px; background: var(--bg4); border-radius: 99px; overflow: hidden; } .progress-bar-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s ease; width: 0%; } .progress-label { font-size: 0.73rem; color: var(--muted); display: flex; justify-content: space-between; }
    .bulk-bar { background: linear-gradient(135deg, #1a3a2a, #0d2818); border: 1px solid rgba(37,211,102,0.3); border-radius: var(--radius); padding: 12px 14px; display: none; flex-direction: column; gap: 10px; } .bulk-bar.visible { display: flex; } .bulk-bar-title { font-family: 'Syne', sans-serif; font-size: 0.78rem; font-weight: 700; color: var(--green); } .bulk-bar-sub { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
    .btn-bulk { padding: 10px; border-radius: 8px; background: var(--green); color: #000; border: none; font-family: 'Syne', sans-serif; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; } .btn-bulk:hover { filter: brightness(1.15); } .btn-bulk:disabled { opacity: 0.4; cursor: not-allowed; }
    .pacing-bar { background: var(--bg3); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius); padding: 12px 14px; display: none; flex-direction: column; gap: 8px; } .pacing-bar.visible { display: flex; } .pacing-title { font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; } .pacing-safe .pacing-title { color: var(--green); } .pacing-warning .pacing-title { color: var(--yellow); } .pacing-danger .pacing-title { color: var(--red); }
    .pacing-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .pacing-stat { background: var(--bg4); border-radius: 6px; padding: 6px 8px; text-align: center; } .pacing-stat-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--text); } .pacing-stat-label { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.3px; margin-top: 1px; }
    .pacing-limit-bar { height: 3px; background: var(--bg4); border-radius: 99px; overflow: hidden; } .pacing-limit-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; width: 0%; } .pacing-limit-fill.safe { background: var(--green); } .pacing-limit-fill.warn { background: var(--yellow); } .pacing-limit-fill.danger { background: var(--red); }
    .pacing-warning-msg { font-size: 0.68rem; line-height: 1.5; padding: 8px 10px; border-radius: 6px; display: none; } .pacing-safe .pacing-warning-msg.safe { display: block; background: rgba(37,211,102,0.08); color: #25D366; } .pacing-warning .pacing-warning-msg.warn { display: block; background: rgba(227,179,65,0.1); color: #E3B341; } .pacing-danger .pacing-warning-msg.danger { display: block; background: rgba(248,81,73,0.1); color: #F85149; }
    .main { overflow-y: auto; padding: 24px 28px 140px; display: flex; flex-direction: column; gap: 14px; } .main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 10px; } .main-title { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
    .top-actions { display: flex; gap: 6px; flex-wrap: wrap; } .btn-small { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--green); font-family: 'Epilogue', sans-serif; font-size: 0.73rem; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; } .btn-small:hover { background: var(--green-dim); } .btn-small.danger { color: var(--red); border-color: rgba(248,81,73,0.3); } .btn-small.danger:hover { background: rgba(248,81,73,0.1); }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; padding: 80px 20px; } .empty-icon { font-size: 3rem; opacity: 0.25; } .empty-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; color: var(--text); opacity: 0.4; } .empty-sub { font-size: 0.85rem; max-width: 300px; line-height: 1.6; }
    .message-card { background: var(--bg2); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 18px; transition: border-color 0.2s; animation: slideIn 0.3s ease both; } .message-card:hover { border-color: rgba(37,211,102,0.2); } .message-card.sent-card { border-color: rgba(37,211,102,0.3); background: rgba(37,211,102,0.02); } @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--green-dim); border: 1.5px solid rgba(37,211,102,0.3); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.8rem; color: var(--green); flex-shrink: 0; } .card-info { flex: 1; min-width: 0; } .card-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; } .card-phone { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .card-status { font-size: 0.66rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; } .status-ready { background: var(--green-dim); color: var(--green); } .status-sent { background: rgba(37,211,102,0.2); color: var(--green); }
    .message-bubble { background: var(--bg3); border-radius: 0 12px 12px 12px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; border-left: 2px solid var(--green); position: relative; margin-bottom: 10px; cursor: text; outline: none; min-height: 40px; } .message-bubble:hover { border-left-color: var(--blue); } .message-bubble:focus { border-left-color: var(--blue) !important; background: var(--bg4); }
    .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; } .char-count { font-size: 0.68rem; color: var(--muted); }
    .btn-copy { padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--muted); font-size: 0.7rem; cursor: pointer; } .btn-copy:hover { color: var(--text); }
    .card-actions { display: flex; gap: 6px; } .btn-send-wa { display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; min-width: 160px; padding: 12px 16px; background: var(--green); color: #000; border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.25s; } .btn-send-wa:hover { filter: brightness(1.1); transform: translateY(-2px); } .btn-send-wa.sent { background: transparent; border: 1.5px solid rgba(37,211,102,0.35); color: var(--green); }
    .export-bar { position: fixed; bottom: 0; right: 0; left: 380px; background: rgba(22,27,34,0.97); border-top: 1px solid var(--border); padding: 12px 24px; display: none; align-items: center; justify-content: space-between; z-index: 50; } .export-bar.visible { display: flex; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; } .modal-overlay.visible { display: flex; } .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; max-width: 440px; width: 90%; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; padding: 10px 22px; font-size: 0.8rem; z-index: 999; transition: transform 0.3s ease; } .toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 750px) { .app { grid-template-columns: 1fr; } .sidebar { position: static; height: auto; } .export-bar { left: 0; } }
    </style>
</head>
<body>
<div class="app">
<header class="header"><div class="logo"><div class="logo-icon">💬</div>Bulk<span>Send</span></div><div class="license-badge" id="licenseBadge">🔑 Verifying...</div><div class="header-stats"><div><span class="stat-val" id="stat-total">0</span>Clients</div><div><span class="stat-val" style="color:var(--green)" id="stat-done">0</span>Ready</div><div><span class="stat-val" style="color:#25D366" id="stat-sent">0</span>Sent</div></div></header>
<aside class="sidebar">
<div><div class="section-title">📋 Client List</div><div class="field"><label>Paste clients — one per line</label><textarea class="paste-area" id="clientList" placeholder="Ahmed Al Mansouri, +971501234567, 2BR in JVC&#10;Sarah Johnson, +971509876543, villa Arabian Ranches&#10;Mohammed Khalid, +971551112233, studio investment"></textarea><div class="paste-hint">Format: Name, Phone, Interest</div></div></div>
<div><div class="section-title">🏠 Campaign</div><div class="field"><label>Property / Offer</label><input type="text" id="campaignProp" placeholder="e.g. 2BR in JVC from AED 850k"></div><div class="field"><label>Your Name / Agency</label><input type="text" id="agentName" placeholder="e.g. Omar · Bloom Properties"></div>
<div class="field"><label>Message Tone</label><div class="chips" id="toneChips"><button class="chip active" onclick="selectChip('tone',this)">Friendly</button><button class="chip" onclick="selectChip('tone',this)">Professional</button><button class="chip" onclick="selectChip('tone',this)">Urgent</button><button class="chip" onclick="selectChip('tone',this)">Luxury</button><button class="chip" onclick="selectChip('tone',this)">Investment</button></div></div>
<div class="field"><label>Language</label><div class="chips" id="langChips"><button class="chip active" onclick="selectChip('lang',this)" data-value="english">English</button><button class="chip" onclick="selectChip('lang',this)" data-value="arabic">العربية</button></div></div></div>
<div><div class="section-title">💬 Message Intent</div><div class="field"><label>What's the goal?</label><div class="chips" id="intentChips"><button class="chip active" onclick="selectChip('intent',this)" data-value="followup">Follow-up</button><button class="chip" onclick="selectChip('intent',this)" data-value="viewing_invite">📅 Viewing</button><button class="chip" onclick="selectChip('intent',this)" data-value="price_drop">💰 Price Drop</button><button class="chip" onclick="selectChip('intent',this)" data-value="new_listing">🆕 New Listing</button><button class="chip" onclick="selectChip('intent',this)" data-value="check_interest">👋 Check In</button><button class="chip" onclick="selectChip('intent',this)" data-value="reconnect">🔄 Reconnect</button><button class="chip" onclick="selectChip('intent',this)" data-value="open_house">🏠 Open House</button><button class="chip" onclick="selectChip('intent',this)" data-value="listing_inquiry">🏠 Listing Inquiry</button><button class="chip" onclick="selectChip('intent',this)" data-value="custom">📝 Custom</button></div></div><div class="field" id="customIntentField" style="display:none;"><label>Describe what you want to ask</label><input type="text" id="customIntent" placeholder="e.g. Ask if they're still looking"></div></div>
<div><div class="progress-wrap" id="progressWrap"><div class="progress-label"><span id="progressText">Generating...</span><span id="progressCount">0 / 0</span></div><div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div></div><button class="btn-generate" id="generateBtn" onclick="startGeneration()">⚡ Generate All Messages</button></div>
<div class="pacing-bar pacing-safe" id="pacingBar"><div class="pacing-title"><span id="pacingIcon">✅</span> Daily Usage</div><div class="pacing-stats"><div class="pacing-stat"><div class="pacing-stat-val" id="pacingSent">0</div><div class="pacing-stat-label">Sent Today</div></div><div class="pacing-stat"><div class="pacing-stat-val" id="pacingRemaining">250</div><div class="pacing-stat-label">Remaining</div></div><div class="pacing-stat"><div class="pacing-stat-val" id="pacingLimit">250</div><div class="pacing-stat-label">Daily Limit</div></div></div><div class="pacing-limit-bar"><div class="pacing-limit-fill safe" id="pacingLimitFill" style="width:0%;"></div></div></div>
<div class="bulk-bar" id="bulkBar"><div class="bulk-bar-info"><div class="bulk-bar-title">🚀 Bulk Send</div><div class="bulk-bar-sub" id="bulkBarSub">Messages ready</div></div><button class="btn-bulk" id="bulkSendBtn" onclick="startBulkSend()">📲 Send All</button></div>
</aside>
<main class="main"><div class="main-header"><div class="main-title">Messages</div><div class="top-actions"><button class="btn-small" onclick="copyAll()">📋 Copy All</button><button class="btn-small" onclick="exportCSV()">⬇ Export CSV</button><button class="btn-small danger" onclick="clearAll()">🗑 Clear</button></div></div><div class="empty-state" id="emptyState"><div class="empty-icon">💬</div><div class="empty-title">No messages yet</div></div><div id="cardsContainer"></div></main>
<div class="export-bar" id="exportBar"><div class="export-info"><strong id="exportCount">0</strong> messages ready</div><div class="export-btns"><button class="btn-export" onclick="exportCSV()">⬇ Download CSV</button></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
const CONFIG = { API_ENDPOINT: 'https://script.google.com/macros/s/AKfycbztFrmRyWZe0djDp7OzxD872dChsCnMDBcfOh-u_H8NjT2bM-zMVQlVBNYJXt3I_msO/exec', LICENSED_DOMAINS: ['propaisuite.com','www.propaisuite.com','djayjux.github.io'], SUPPORT_WA: '971582452639' };
let userPlan = 'starter';
let userFeatures = null;

(function() {
  const currentDomain = window.location.hostname;
  const urlParams = new URLSearchParams(window.location.search);
  const keyParam = urlParams.get('key');
  if (!keyParam) { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0D1117;color:#F85149;font-family:Epilogue,sans-serif;"><h1>🔒 License Key Required</h1></div>'; return; }
  
async function validateLicense() {
    const termsAccepted = localStorage.getItem('propai_terms_accepted');
    if (!termsAccepted) {
      showTermsGate();
      return false;
    }
    
    try {
      const res = await fetch(CONFIG.API_ENDPOINT + '?key=' + encodeURIComponent(keyParam));
      const data = await res.json();
      if (data.valid) {
        document.getElementById('licenseBadge').textContent = '🔑 ' + (data.agency || 'Licensed') + ' (' + data.plan + ')';
        userPlan = data.plan || 'starter';
        userFeatures = data.features;
        PACING.init(data.plan || 'starter', data.dailyLimit || 250);
        applyFeatureGating(data.features);
        return true;
      } else {
        showBlocked(data.error || 'Invalid license');
        return false;
      }
    } catch(e) {
      showBlocked('Unable to verify license. Check your internet connection.');
      return false;
    }
  }    
  function applyFeatureGating(features) {
    if (!features) return;
    
    // Hide intents not in plan
    if (features.intents) {
      document.querySelectorAll('#intentChips .chip').forEach(chip => {
        if (!features.intents.includes(chip.dataset.value)) {
          chip.classList.add('locked');
          chip.title = 'Upgrade to unlock';
          chip.onclick = function(e) { e.preventDefault(); showToast('🔒 Upgrade to Agency plan to unlock this intent'); };
        }
      });
    }
    
    // Hide tones not in plan
    if (features.tones) {
      document.querySelectorAll('#toneChips .chip').forEach(chip => {
        if (!features.tones.includes(chip.textContent.trim())) {
          chip.classList.add('locked');
          chip.title = 'Upgrade to unlock';
          chip.onclick = function(e) { e.preventDefault(); showToast('🔒 Upgrade to Agency plan to unlock this tone'); };
        }
      });
    }
    
    // Hide Arabic if not in plan
    if (features.languages && !features.languages.includes('arabic')) {
      const arabicChip = document.querySelector('#langChips .chip[data-value="arabic"]');
      if (arabicChip) { arabicChip.classList.add('locked'); arabicChip.onclick = function(e) { e.preventDefault(); showToast('🔒 Upgrade to Agency for Arabic'); }; }
    }
  }
    
    function showTermsGate() {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0D1117;color:#E6EDF3;font-family:'Epilogue',sans-serif;padding:20px;">
        <div style="max-width:500px;background:#161B22;border:1px solid rgba(37,211,102,0.2);border-radius:16px;padding:32px;text-align:center;">
          <div style="font-size:3rem;margin-bottom:16px;">📋</div>
          <h1 style="font-family:'Syne',sans-serif;font-size:1.3rem;margin-bottom:8px;color:#25D366;">Terms of Use</h1>
          <p style="font-size:0.82rem;color:#7D8590;line-height:1.6;margin-bottom:20px;text-align:left;">
            By using PropAI Suite, you agree that:
          </p>
          <ul style="text-align:left;font-size:0.78rem;color:#7D8590;line-height:1.8;margin-bottom:20px;padding-left:20px;">
            <li>You are a licensed real estate agent in the UAE</li>
            <li>You will only message individuals with legitimate interest in real estate</li>
            <li>You are solely responsible for complying with UAE laws, RERA regulations, and WhatsApp terms of service</li>
            <li>PropAI Suite is not liable for WhatsApp account restrictions, legal violations, or any damages arising from use of this tool</li>
            <li>Messages generated are AI-assisted and should be reviewed before sending</li>
          </ul>
          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;text-align:left;">
            <input type="checkbox" id="termsAgree" style="width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:#25D366;">
            <label for="termsAgree" style="font-size:0.75rem;color:#E6EDF3;line-height:1.5;">I have read and agree to the Terms of Use. I understand that misuse may result in WhatsApp account restrictions.</label>
          </div>
          <button id="acceptBtn" disabled style="width:100%;padding:14px;background:#25D366;color:#000;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;opacity:0.4;transition:all 0.2s;">
            Accept & Continue
          </button>
          <p style="font-size:0.65rem;color:#7D8590;margin-top:12px;">
            Need help? <a href="https://wa.me/${CONFIG.SUPPORT_WA}" target="_blank" style="color:#25D366;">Contact us on WhatsApp</a>
          </p>
        </div>
      </div>`;
    
    // Enable button when checkbox is checked
    document.getElementById('termsAgree').addEventListener('change', function() {
      const btn = document.getElementById('acceptBtn');
      btn.disabled = !this.checked;
      btn.style.opacity = this.checked ? '1' : '0.4';
    });
     document.getElementById('acceptBtn').addEventListener('click', function() {
      if (document.getElementById('termsAgree').checked) {
        localStorage.setItem('propai_terms_accepted', 'true');
        location.reload();
      }
    });
    }
      function showBlocked(msg) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0D1117;color:#F85149;font-family:Epilogue,sans-serif;text-align:center;padding:20px;"><div><h1>🔒 Access Restricted</h1><p style="color:#7D8590;margin-top:12px;">' + msg + '</p><a href="https://wa.me/' + CONFIG.SUPPORT_WA + '" target="_blank" style="display:inline-block;margin-top:16px;padding:12px 24px;background:#25D366;color:#000;border-radius:8px;text-decoration:none;font-weight:700;">📲 Contact Support</a></div></div>';
  }    
    validateLicense();
})();

const PACING = { tier: 'starter', dailyLimit: 250, sentToday: 0, sentThisSession: 0, sessionStartTime: null, todayDate: new Date().toDateString(), coolDownUntil: null, SESSION_LIMIT: 50, SESSION_COOLDOWN: 30,
  init(tier, limit) { this.tier = tier || 'starter'; this.dailyLimit = limit || 250; const saved = localStorage.getItem('propai_pacing'); if (saved) { try { const data = JSON.parse(saved); if (data.todayDate === new Date().toDateString()) { this.sentToday = data.sentToday || 0; this.coolDownUntil = data.coolDownUntil ? new Date(data.coolDownUntil) : null; } } catch(e) {} } this.todayDate = new Date().toDateString(); this.save(); this.updateUI(); },
  get remaining() { return Math.max(0, this.dailyLimit - this.sentToday); }, get usagePct() { return (this.sentToday / this.dailyLimit) * 100; },
  save() { localStorage.setItem('propai_pacing', JSON.stringify({ sentToday: this.sentToday, todayDate: this.todayDate, coolDownUntil: this.coolDownUntil?.toISOString() })); },
  canSend(count = 1) { if (this.sentToday + count > this.dailyLimit) return { allowed: false, reason: `Daily limit of ${this.dailyLimit} reached.` }; if (this.coolDownUntil && new Date() < this.coolDownUntil) { const mins = Math.ceil((this.coolDownUntil.getTime() - Date.now()) / 60000); return { allowed: false, reason: `Cooldown active. Wait ${mins} minutes.` }; } if (this.sentThisSession + count > this.SESSION_LIMIT) { this.coolDownUntil = new Date(Date.now() + this.SESSION_COOLDOWN * 60000); this.save(); return { allowed: false, reason: `Session limit reached. Cool down ${this.SESSION_COOLDOWN} min.` }; } if (this.usagePct > 80) return { allowed: true, warning: true, reason: `${Math.round(this.usagePct)}% of daily limit used.` }; return { allowed: true, warning: false, reason: '' }; },
  recordSend(count = 1) { this.sentToday += count; this.sentThisSession += count; if (!this.sessionStartTime) this.sessionStartTime = new Date(); this.save(); this.updateUI(); },
  updateUI() { const bar = document.getElementById('pacingBar'); if (!bar) return; const pct = Math.min(100, this.usagePct); let status = 'safe'; if (pct > 90) status = 'danger'; else if (pct > 70) status = 'warning'; bar.className = 'pacing-bar visible pacing-' + status; document.getElementById('pacingSent').textContent = this.sentToday; document.getElementById('pacingRemaining').textContent = this.remaining; document.getElementById('pacingLimit').textContent = this.dailyLimit; const fill = document.getElementById('pacingLimitFill'); fill.style.width = pct + '%'; fill.className = 'pacing-limit-fill ' + status; } };

let generatedMessages=[], isGenerating=false, sentCount=0, originalMessages={};
function selectChip(group, el) { const container = document.getElementById(group==='tone'?'toneChips':group==='lang'?'langChips':'intentChips'); container.querySelectorAll('.chip:not(.locked)').forEach(c => c.classList.remove('active')); el.classList.add('active'); if (group==='intent') { document.getElementById('customIntentField').style.display = el.dataset.value==='custom'?'flex':'none'; } }
function selectedTone() { const el = document.querySelector('#toneChips .chip.active'); return el ? el.textContent.trim() : 'Friendly'; }
function selectedIntent() { const el = document.querySelector('#intentChips .chip.active'); return el ? el.dataset.value : 'followup'; }
function selectedLanguage() { const el = document.querySelector('#langChips .chip.active'); return el ? el.dataset.value : 'english'; }
function getCustomIntent() { return selectedIntent()==='custom' ? document.getElementById('customIntent').value.trim() || 'Ask if interested' : ''; }
function parseClients(raw) { return raw.split('\n').map(l => l.trim()).filter(l => l.length > 2).map(line => { const p = line.split(',').map(s => s.trim()); return { name: p[0] || 'Client', phone: p[1] || '', interest: p.slice(2).join(', ') || 'property in Dubai' }; }); }
function getInitials(name) { return name.split(' ').slice(0,2).map(w => w[0]?.toUpperCase()||'').join(''); }
function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2500); }

function fallbackMessage(client, campaignProp, agentName, tone, intent, customIntent, language) {
  const firstName = (client.name || 'Client').split(' ')[0]; const prop = campaignProp || 'a prime property'; const isArabic = language === 'arabic';
  if (isArabic) { const t = { 'followup': [`مرحباً ${firstName}، متابعة بعد حديثنا عن ${client.interest || 'العقار'}. هل فكرت؟`], 'listing_inquiry': [`${firstName}، هل فكرت في بيع عقارك في ${client.interest || 'منطقتك'}؟`] }; return (t[intent] || t['followup'])[0]; }
  const t = { 'followup': [`Hey ${firstName}, just checking in after our chat about ${client.interest || 'the property'}. Had any time to think? No pressure 😊`], 'viewing_invite': [`${firstName}, viewing for ${prop} — tomorrow 4pm or Thursday 11am? 🏠`], 'listing_inquiry': [`Hi ${firstName}, I was wondering if you've considered selling your property in ${client.interest || 'the area'}? Similar homes are getting great prices. Want a free valuation?`] };
  return (t[intent] || t['followup'])[0];
}

async function generateOne(client, index, campaignProp, agentName, tone, intent, customIntent, language) {
  try {
    const key = new URLSearchParams(window.location.search).get('key');
    const messageData = { clients: [client], campaignProp, agentName, tone, intent, customIntent, language };
   const url = CONFIG.API_ENDPOINT + '?key=' + encodeURIComponent(key) + '&action=generate&messageData=' + encodeURIComponent(JSON.stringify(messageData));
const res = await fetch(url);

        const msg = data.messages[0].message;
        generatedMessages[index] = { client, message: msg, campaignProp, agentName, tone, intent, language, sent: false, edited: false };
        originalMessages[index] = msg;
        return msg;
      } else if (data.error) { showToast('⚠️ ' + data.error); }
    }
  } catch(e) {}
  await new Promise(r => setTimeout(r, 200));
  const msg = fallbackMessage(client, campaignProp, agentName, tone, intent, customIntent, language);
  generatedMessages[index] = { client, message: msg, campaignProp, agentName, tone, intent, language, sent: false, edited: false };
  originalMessages[index] = msg;
  return msg;
}

const intentLabels = { 'followup': 'Follow-up', 'viewing_invite': '📅 Viewing', 'price_drop': '💰 Price Drop', 'new_listing': '🆕 New Listing', 'check_interest': '👋 Checking In', 'reconnect': '🔄 Reconnect', 'open_house': '🏠 Open House', 'listing_inquiry': '🏠 Listing Inquiry', 'custom': '📝 Custom' };
function createCard(client, index) { const card = document.createElement('div'); card.className = 'message-card'; card.id = 'card-' + index; card.style.animationDelay = Math.min(index * 0.04, 0.25) + 's'; const firstName = (client.name || 'Client').split(' ')[0]; card.innerHTML = '<div class="card-header"><div class="avatar">' + getInitials(client.name) + '</div><div class="card-info"><div class="card-name">' + esc(client.name) + '</div><div class="card-phone">' + esc(client.phone || 'No phone') + ' · ' + esc(client.interest) + '</div></div><div class="card-status status-ready">✓ Ready</div></div><div class="message-bubble" id="msgBubble-' + index + '" contenteditable="true" spellcheck="false"></div><div class="card-meta"><div class="char-count" id="chars-' + index + '"></div><button class="btn-copy" onclick="copyMsg(' + index + ',this)">📋 Copy</button></div><div class="card-actions"><button class="btn-send-wa" id="sendbtn-' + index + '" onclick="sendWA(' + index + ',this)">📲 Send to ' + esc(firstName) + ' on WhatsApp</button></div>'; return card; }
function updateCard(index, message, intent) { document.getElementById('msgBubble-' + index).textContent = message; document.getElementById('chars-' + index).textContent = message.length + ' chars'; }
function copyMsg(index, btn) { navigator.clipboard.writeText(generatedMessages[index].message).then(() => { btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = '📋 Copy', 1500); }); }

async function startGeneration() {
  if (isGenerating) return;
  const raw = document.getElementById('clientList').value;
  const campaignProp = document.getElementById('campaignProp').value.trim();
  const agentName = document.getElementById('agentName').value.trim();
  const tone = selectedTone(); const intent = selectedIntent();
  const customIntent = getCustomIntent(); const language = selectedLanguage();
  const clients = parseClients(raw);
  if (!clients.length) { showToast('Please paste at least one client'); return; }
  isGenerating = true; generatedMessages = []; originalMessages = {}; sentCount = 0;
  document.getElementById('cardsContainer').innerHTML = ''; document.getElementById('emptyState').style.display = 'none';
  document.getElementById('generateBtn').disabled = true; document.getElementById('progressWrap').classList.add('visible');
  document.getElementById('stat-total').textContent = clients.length; document.getElementById('stat-done').textContent = '0'; document.getElementById('stat-sent').textContent = '0';
  document.getElementById('exportBar').classList.add('visible'); document.getElementById('exportCount').textContent = clients.length;
  document.getElementById('bulkBar').classList.add('visible'); document.getElementById('pacingBar').classList.add('visible');
  for (let i = 0; i < clients.length; i++) { document.getElementById('cardsContainer').appendChild(createCard(clients[i], i)); }
  for (let i = 0; i < clients.length; i++) {
    const msg = await generateOne(clients[i], i, campaignProp, agentName, tone, intent, customIntent, language);
    updateCard(i, msg, intent);
    document.getElementById('stat-done').textContent = i + 1; document.getElementById('progressCount').textContent = (i+1) + ' / ' + clients.length;
    document.getElementById('progressFill').style.width = (((i+1) / clients.length) * 100) + '%';
  }
  document.getElementById('generateBtn').disabled = false; isGenerating = false;
  setTimeout(() => document.getElementById('progressWrap').classList.remove('visible'), 2000);
  showToast(clients.length + ' messages generated!');
}

function sendWA(index, btn) { const d = generatedMessages[index]; if (!d || !d.client.phone) { showToast('⚠️ No phone number'); return; } const check = PACING.canSend(1); if (!check.allowed) { showToast('⚠️ ' + check.reason); return; } d.sent = true; sentCount++; PACING.recordSend(1); document.getElementById('stat-sent').textContent = sentCount; btn.classList.add('sent'); btn.innerHTML = '✓ Sent'; window.open('https://wa.me/' + d.client.phone.replace(/\D/g, '') + '?text=' + encodeURIComponent(d.message), '_blank'); }
function copyAll() { if (!generatedMessages.length) return; navigator.clipboard.writeText(generatedMessages.map((m,i) => '--- ' + m.client.name + ' ---\n' + m.message).join('\n\n')); showToast('All copied!'); }
function exportCSV() { if (!generatedMessages.length) return; let csv = 'Name,Phone,Interest,Message,Intent,Language,Status\n'; generatedMessages.forEach(m => csv += '"' + m.client.name + '","' + m.client.phone + '","' + m.client.interest + '","' + m.message.replace(/"/g,'""') + '","' + (m.intent||'') + '","' + (m.language||'english') + '","' + (m.sent?'Sent':'Ready') + '"\n'); const b = new Blob([csv],{type:'text/csv'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'bulksend_' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(u); }
function clearAll() { if (confirm('Clear all?')) { generatedMessages = []; originalMessages = {}; sentCount = 0; document.getElementById('cardsContainer').innerHTML = ''; document.getElementById('emptyState').style.display = 'flex'; document.getElementById('exportBar').classList.remove('visible'); document.getElementById('bulkBar').classList.remove('visible'); } }
document.addEventListener('DOMContentLoaded', () => { const bar = document.getElementById('pacingBar'); if (bar) bar.classList.add('visible'); PACING.updateUI(); });});
